*{box-sizing:border-box}body{margin:0;font:15px/1.65 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--bg)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:9px;padding:8px 12px;background:white;color:var(--ink)}button.primary{background:var(--blue);color:white;border-color:var(--blue)}button:disabled{opacity:.5;cursor:not-allowed}.app{min-height:100vh}.top{height:auto;min-height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:14px clamp(14px,3vw,36px);gap:16px;position:sticky;top:0;z-index:20}.brand{display:flex;gap:12px;align-items:center}.logo{width:42px;height:42px;border-radius:12px;background:var(--blue2);display:grid;place-items:center;color:var(--blue);font-size:22px}.brand h1{font-size:16px;margin:0}.brand small{display:block;color:var(--muted)}.top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.role-switch{display:flex;background:#edf1f7;border-radius:10px;padding:3px}.role-switch button{border:0;background:transparent}.role-switch button.active{background:white;box-shadow:0 1px 4px #0001;color:var(--blue);font-weight:700}.layout{display:grid;grid-template-columns:minmax(0,1fr);max-width:1500px;margin:auto;min-height:calc(100vh - 72px)}aside{padding:10px clamp(14px,3vw,36px);border-right:0;border-bottom:1px solid var(--line);background:#f9fbfe;display:flex;align-items:center;gap:7px;flex-wrap:wrap}#sidebar .navlabel{flex:0 0 100%;padding:2px 4px 5px}#sidebar .nav{width:auto;flex:1 1 auto;justify-content:center;text-align:center;white-space:nowrap;margin:0;padding:9px 12px;gap:7px}#sidebar .nav span:first-child{width:auto}#sidebar .panel{margin:4px 0!important;padding:7px 10px!important;display:flex;align-items:center;gap:9px;flex-wrap:wrap}#sidebar .panel .pill{margin-top:0!important}#sidebar .footer-note{margin:4px 0 4px auto}.navlabel{font-size:11px;color:v ottom:2px dotted #b87912;cursor:pointer;background:linear-gradient(transparent 70%,#fff0c9 70%);border-radius:2px;padding:0 1px;color:inherit;font-weight:600;display:inline;line-height:inherit}.vocab:focus{outline:2px solid #6d9ae6}.reader-tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}.side-sticky{position:sticky;top:100px}.definition .word{font-size:23px;font-weight:750}.definition .en{padding:12px;background:#f5f8fc;border-radius:10px;margin-top:12px}.definition .key{font-size:12px;color:var(--muted);margin-top:8px}.definition .close{float:right}.definition-popover{position:fixed;z-index:45;width:min(360px,calc(100vw - 24px));max-height:min(70vh,520px);overflow:auto;background:#fff;border:1px solid #d8e0eb;border-radius:14px;padding:18px;box-shadow:0 12px 36px #16263b30}.definition-popover .word{font-size:23px;font-weight:750}.definition-popover .en{padding:12px;background:#f5f8fc;border-radius:10px;margin-top:12px}.definition-popover .close{float:right}.definition-popover:after{content:'';display:block;clear:both}.empty{color:var(--muted);text-align:center;padding:22px}.question{border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0}.question h4{margin:0 0 10px}.option{display:flex;gap:9px;padding:8px 4px;align-items:flex-start}.option input{margin-top:6px}.question textarea{width:100%;min-height:100px;border:1px solid #cbd5e1;border-radius:9px;padding:10px}.result{padding:12px;border-radius:10px;margin-top:10px;background:#f1f7ff}.result.good{background:#e8f6ee}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:620px}th,td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}th{background:#f7f9fc;color:#506078;font-size:13px}tr:last-child td{border-bottom:0}.filters{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}.filters input,.filters select,.field{border:1px solid #cbd5e1;border-radius:9px;padding:9px 11px;background:white;max-width:100%}.field{width:100%} <script>
const DATA = {"article":{"导读":["人去世以后，留下来的人会怎样记住他们？不同地方有不同的答案。每年清明前后，中国人会去墓地扫墓、献花；到了墨西哥的亡灵节，许多家庭则把食物和灯带到墓地，有时还会在那里唱歌、聊天。一个安静，一个热闹，乍看之下差别很大。可是，如果多了解一些，就会发现，这些做法都和家人有关，也都在帮助人们留住逝者的记忆。"],"中国：一段没有被忘记的故事":["春秋时期，晋国公子重耳因为国内发生动乱，不得不离开家乡。他在外流亡了十九年，日子过得并不容易。一路上，愿意跟着他的人很少，介子推却一直没有离开。","有一年，一行人走到人少的地方，带来的粮食吃完了，四处寻找也找不到吃的。重耳饿得连坐起来的力气都没有。过了一会儿，介子推端来一碗肉汤。喝下汤后，重耳才慢慢恢复力气。后来他才明白，那碗汤里的肉竟是介子推从自己腿上割下来的。","十九年后，重耳终于回到晋国，成为国君，也就是后来的晋文公。他没有忘记许多曾帮助过自己的人，便给他们奖赏；却没有给介子推奖赏。有人替介子推抱不平，把这件事告诉了晋文公。可介子推并不打算主动要求回报。在他看来，重耳能回国并不是靠某一个人的力量，他也没必要反复提起自己帮过重耳。不久，他带着母亲悄悄进了绵山，隐居起来。","听说介子推进了山，晋文公很快就后悔了，亲自带人去找他。山里的路不好走，找了很久仍然没有消息。有人出了个主意：从三面放火，把另一边留下来，介子推为了照顾母亲，也许会从那边出来。晋文公竟然同意了。火烧了三天，山里始终没有人走出来。等火熄灭后，人们才在一棵被烧黑的柳树下发现介子推和他的母亲。","这件事让晋文公十分难过。他留下绵山附近的一块地方纪念介子推，还规定这一天不许生火，大家只能吃事先准备好的冷食。民间传说，寒食节就是这样来的。后来，寒食节和清明节的日期相近，两个节日也渐渐联系在一起。如今到了清明，不少中国人仍会去扫墓、献花，或带上供品。祭拜的方式随着时代有些变化，回去看望去世亲人的心情却留了下来。"],"墨西哥：让亲人仿佛回到家中":["墨西哥的亡灵节在每年十一月一日和二日举行。它并不像有些人想的那样，只让人感到悲伤。快到节日时，市场里摆满了橙黄色的万寿菊、骷髅形状的糖块和面包。各家也忙着准备：有人整理亲人的照片，有人做他们以前爱吃的饭菜，再把照片、食物和灯放在家中的小祭坛上。当地还流传着一种说法，万寿菊的花香能为回来的亲人指路。","到了十一月一日晚上，有些家庭会带上食物和毯子去墓地，有些人还会带琴。那里不只有鲜花和烛光，也听得到琴声和歌声。大人坐在一起，讲起逝者从前的生活；孩子在墓地里走来走去，听着这些既熟悉又新鲜的故事。有的家人会在墓旁铺开毯子，一直陪到天亮。对他们而言，这一夜不是要把悲伤赶走，而是想让离开的亲人重新走进家庭生活。","孩子们也会在准备节日的过程中认识自己的家庭。跟着家里的大人摆好照片、布置祭坛时，他们常常会问：“照片里的人是谁？”于是，关于某位祖父、姑妈或曾祖母的故事就被讲了出来：那个人喜欢什么，年轻时做过什么，又给家人留下了哪些回忆。二〇〇八年，联合国教科文组织将墨西哥亡灵节列入人类非物质文化遗产名录。这个节日纪念逝者，也提醒人们珍惜生命。","这些年，亡灵节的图案和装饰逐渐出现在墨西哥以外的地方。电影、商店和网络平台让更多人认识了彩色骷髅和万寿菊，有些地方还办起了相关活动。不过，热闹起来也带来一个问题：如果人们只把它当成一场化装派对，会不会忘了它原来和家人、记忆和纪念有关？一些墨西哥人对此感到矛盾。一方面，他们乐于看到本国文化被更多人了解；另一方面，又希望外界看到的不只是节日的样子。"],"两种纪念，同一个心思":["把介子推的故事和墨西哥亡灵节放在一起看，乍一看，很难想到它们有什么相似之处。一边是禁火，一边是点烛；一边带着悲伤和悔意，一边却有歌声、饭菜和热闹的人群。但仔细想想，两边的人其实都在做一件事：把某一天从普通日子里分出来，专门留给已经离开的人。","晋文公用禁火的规定纪念介子推，墨西哥人则在特定的日子里摆好祭坛，准备食物，把墓地照亮，像迎接一位远道而来的亲人。两种做法看起来相反，却都不只是在心里想念。人们需要一个日子，也需要一些看得见、做得到的事情，让记忆不至于随着时间慢慢消失。","这些事情通常从家里开始。介子推的故事中，国君为他划出祭田，可年年去祭扫的，还有他的家人和乡里。到了亡灵节，家庭的作用就更加明显了：祭坛设在家中，饭菜按亲人喜欢吃的来准备，家人还会带着孩子去墓地守夜。照片、食物、鲜花，看起来都是平常的东西，放在这个时候，却有了特别的意义。人们不是把所有去世的人放在一起纪念，而是在想念某一个人，想起他以前的样子，想起他曾经怎样生活在这个家里。","当然，纪念亲人的方式并不只有这一种。有些纪念活动面向整个社会，例如纪念为国家牺牲的人，常常由公共机构组织，大家共同表达尊重。清明扫墓和亡灵节则更接近家庭生活。它们让人想起的，往往不是很久以前的历史人物，而是自己的祖辈、父母，或某个已经离开却一直被家人记着的人。也正因为如此，这两个节日虽然来自不同的文化，却有一种相近的亲切感。","不过，亲切不等于相同。清明扫墓时，人们通常安静一些：清理墓地，摆上供果，有时烧纸钱，说话也会放轻，仿佛不愿惊扰逝者。亡灵节的气氛却热闹得多。人们唱歌、弹琴、准备食物，有的家庭还会在墓地守上一夜，仿佛亲人真的会回来，和大家一起度过这个日子。清明让人感到死亡和生命之间有一道需要尊重的界线；亡灵节则试着跨过这道界线，让离开的人在记忆中重新回到家里。两种心情并不需要分出高下，它们只是用不同的方式面对同一件事：亲人不在了，人却仍然想念他。","节日的时间安排，也和各自的文化有关。清明和春天的时节有关，天气转暖，草木发芽，人们出门扫墓，也常去踏青。祭扫和春天的景色放在一起，悲伤之中便多了一点生命重新开始的意味。墨西哥亡灵节则在十一月开始时举行，时间和当地宗教中纪念逝者的日子相近。一个随着自然的变化到来，一个按照历法安排日期，但日子一到，人们便会停下手中的事情，为逝去的人留出时间。平常不一定说出口的想念，也就有了表达的机会。","而且，这样的纪念不只与逝者有关，也会影响活着的人。介子推的故事一代代流传，提醒人们不要忘记曾经帮助过自己的人；墨西哥的父母教孩子布置祭坛、准备食物，也是在讲家里以前的事：照片上的人是谁，他喜欢什么，他曾经做过什么。孩子未必一下子明白死亡的意义，却会在年复一年的准备中认识自己的家人，慢慢知道自己从哪里来。于是，纪念不只是回头看，也是在把一个家庭的故事讲给孩子们。","今天，这些做法也在发生变化。在中国，有人用鲜花代替烧纸，有人选择网上祭扫，也有人请别人代为扫墓。墨西哥的亡灵节受到商业活动和网络平台的影响，鲜艳的装饰和热闹的表演越来越受人关注，有时却让人忽略了家人到墓前守夜的传统。变化难免让人担心：当纪念变得方便，甚至成了供人观看的热闹场面，那份想念还在不在？或许，答案不只在于人们用了什么方式。鲜花可以代替纸钱，照片也可以出现在屏幕上；真正重要的是，人们是否还愿意停下脚步，想起那些离开的人，愿意把他们的故事讲给后来的人听。","人走过一生，总会在别人的记忆里留下些痕迹。活着的人能做的，就是用一些具体的行动，把这些痕迹接住，再往下传一代。火会灭，花会枯，纸钱会烧完，可只要还有一个日子，还有一个人记得去，还有人愿意把故事讲下去，这份纪念就不会轻易断掉。"]},"vocab":[{"word":"流亡","pinyin":"liú wáng","pos":"动","zh":"因战争或政治原因离开自己的国家或家乡。","en":"To be forced to leave one's home or country and live elsewhere, often because of war or political trouble."},{"word":"偏僻","pinyin":"piān pì","pos":"形","zh":"离城市或人多的地方较远。","en":"Far away from cities or crowded places; remote or isolated."},{"word":"介子推","pinyin":"Jiè Zǐtuī","pos":"专名","zh":"春秋时期晋国人物，民间传说中与寒食节有关。","en":"Jie Zitui, a figure from the Spring and Autumn period associated in Chinese tradition with the Cold Food Festival."},{"word":"奖赏","pinyin":"jiǎng shǎng","pos":"动/名","zh":"因为某人的表现或贡献而给予奖励。","en":"To reward someone, or a reward given for an achievement or contribution."},{"word":"回报","pinyin":"huí bào","pos":"动/名","zh":"用行动或好处回应别人给予的帮助。","en":"To repay or return someone's help, kindness, or effort."},{"word":"隐居","pinyin":"yǐn jū","pos":"动","zh":"住在安静、少有人来的地方，不参与外面的生活。","en":"To live in seclusion, away from public life and other people."},{"word":"懊悔/后悔","pinyin":"ào huǐ / hòu huǐ","pos":"动/形","zh":"因为做错了事或没有做好某事而感到难过。","en":"To feel regret or sorrow about something one has done or failed to do."},{"word":"寒食节","pinyin":"Hánshí Jié","pos":"专名","zh":"民间传说中与介子推有关的传统节日。","en":"The Cold Food Festival, a traditional Chinese observance linked in folklore to Jie Zitui."},{"word":"供品","pinyin":"gòng pǐn","pos":"名","zh":"祭祀或纪念时摆放的食物、鲜花等。","en":"Offerings such as food or flowers placed for worship, remembrance, or to honor the deceased."},{"word":"亡灵节","pinyin":"Wánglíng Jié","pos":"专名","zh":"墨西哥每年十一月一日和二日举行的传统节日。","en":"Mexico’s Day of the Dead, observed around November 1–2 to remember deceased family members and friends."},{"word":"万寿菊","pinyin":"wàn shòu jú","pos":"名","zh":"一种常见的橙黄色花，常用于墨西哥亡灵节。","en":"A marigold, a plant with bright yellow or orange flowers; marigolds are widely used in Mexico’s Day of the Dead celebrations."},{"word":"祭坛","pinyin":"jì tán","pos":"名","zh":"举行祭祀或纪念活动时摆放物品的地方。","en":"An altar: a place or structure where offerings are arranged for religious worship or to remember the dead."},{"word":"逝者","pinyin":"shì zhě","pos":"名","zh":"已经去世的人。","en":"The deceased; a person or people who have died."},{"word":"遗产","pinyin":"yí chǎn","pos":"名","zh":"前人留下来的财物、文化或精神财富。","en":"Property, traditions, or cultural values passed down from earlier generations; heritage."},{"word":"团聚","pinyin":"tuán jù","pos":"动","zh":"家人或朋友分开后重新聚在一起。","en":"To reunite or come together again after being apart."},{"word":"形式","pinyin":"xíng shì","pos":"名","zh":"事情表现出来的样子或方式。","en":"The form, shape, or way in which something is done or expressed."},{"word":"传统","pinyin":"chuán tǒng","pos":"名/形","zh":"从过去传到现在的习惯、文化或做法。","en":"A custom, belief, or practice passed down from one generation to another; tradition."},{"word":"凋谢","pinyin":"diāo xiè","pos":"动","zh":"花朵枯萎、脱落。","en":"For a flower to wither or lose its petals."},{"word":"重耳","pinyin":"Chóng'ěr","pos":"专名","zh":"春秋时期晋国公子，后来成为晋文公。","en":"Chong'er, a prince of the state of Jin who later became Duke Wen of Jin."},{"word":"晋文公","pinyin":"Jìn Wén Gōng","pos":"专名","zh":"春秋时期晋国国君，重耳即位后的称号。","en":"Duke Wen of Jin, the title Chong'er held after becoming ruler of Jin."},{"word":"绵山","pinyin":"Mián Shān","pos":"专名","zh":"与介子推传说有关的山名。","en":"Mianshan, a mountain associated with the traditional story of Jie Zitui."},{"word":"清明节","pinyin":"Qīngmíng Jié","pos":"文化词","zh":"中国传统节日，人们常在这一天扫墓、献花或踏青。","en":"Qingming Festival, a Chinese observance when people visit graves, honor ancestors, and enjoy spring outings."},{"word":"联合国教科文组织","pinyin":"Liánhéguó Jiàokēwén Zǔzhī","pos":"机构名","zh":"联合国负责教育、科学、文化等事务的专门机构。","en":"UNESCO, the United Nations agency responsible for education, science, and culture."},{"word":"人类非物质文化遗产名录","pinyin":"rén lèi fēi wù zhì wén huà yí chǎn míng lù","pos":"文化专名","zh":"记录具有重要文化价值、需要保护和传承的非物质文化遗产。","en":"UNESCO's list recognizing important living cultural practices and traditions that communities seek to safeguard."},{"word":"祭田","pinyin":"jì tián","pos":"文化词","zh":"传统语境中用于祭祀或纪念的田地。","en":"Land traditionally set aside to support rituals or memorial observances."},{"word":"祖辈","pinyin":"zǔ bèi","pos":"名","zh":"祖父母及更早的长辈。","en":"Ancestors or earlier generations of a family, especially grandparents and those before them."},{"word":"非物质文化遗产","pinyin":"fēi wù zhì wén huà yí chǎn","pos":"文化词","zh":"以传统活动、知识、技艺等形式传承的文化遗产。","en":"Intangible cultural heritage: living traditions, knowledge, skills, and practices passed between generations."},{"word":"扫墓","pinyin":"sǎo mù","pos":"动","zh":"到墓地清理、祭拜，表达对逝者的怀念。","en":"To visit and tend a grave, often to show respect for someone who has died."},{"word":"踏青","pinyin":"tà qīng","pos":"动","zh":"春天到郊外散步、游玩，欣赏春天的景色。","en":"To go on a spring outing in the countryside and enjoy the fresh greenery."},{"word":"禁火","pinyin":"jìn huǒ","pos":"动/名","zh":"禁止生火，传统上与寒食节的习俗有关。","en":"A prohibition on lighting fires; traditionally associated with the Cold Food Festival."},{"word":"祭拜","pinyin":"jì bài","pos":"动","zh":"通过一定的仪式向祖先或逝者表示敬意和怀念。","en":"To pay respects to ancestors or the deceased through a ritual or offering."},{"word":"祭扫","pinyin":"jì sǎo","pos":"动","zh":"到墓地祭拜并清理墓地。","en":"To visit a grave to pay respects and clean or tend the burial place."},{"word":"供果","pinyin":"gòng guǒ","pos":"名","zh":"祭拜时摆放的水果。","en":"Fruit placed as an offering during a memorial or religious ritual."},{"word":"烧纸钱","pinyin":"shāo zhǐ qián","pos":"动","zh":"祭祀时焚烧纸制的钱，传统上认为是送给逝者的。","en":"To burn joss paper, traditionally as a symbolic offering for deceased relatives."},{"word":"守夜","pinyin":"shǒu yè","pos":"动","zh":"夜间守在某处不离开；在本文中指陪伴逝者、在墓地待到天亮。","en":"To keep vigil through the night; here, to stay at a grave through the night in remembrance."},{"word":"骷髅","pinyin":"kū lóu","pos":"名","zh":"人的头骨或骨架；也常作为艺术装饰图案。","en":"A human skull or skeleton; also used as a decorative motif."},{"word":"化装派对","pinyin":"huà zhuāng pài duì","pos":"名","zh":"参加者穿上特殊服装、改变外表的聚会。","en":"A costume party where people dress up as different characters or in unusual outfits."},{"word":"抱不平","pinyin":"bào bù píng","pos":"动","zh":"看到别人受到不公平的对待而感到不满，愿意替他说话。","en":"To speak up for someone or feel indignant because they have been treated unfairly."},{"word":"流传","pinyin":"liú chuán","pos":"动","zh":"消息、故事、习俗等从一个人或一代传到另一个人或下一代。","en":"To be passed on or spread from person to person or from one generation to the next."},{"word":"动乱","pinyin":"dòng luàn","pos":"名","zh":"社会或政治秩序不稳定、发生混乱的状态。","en":"Unrest or turmoil, especially when social or political order is disrupted."},{"word":"祭祀","pinyin":"jì sì","pos":"动/名","zh":"通过仪式向神灵或祖先表达敬意。","en":"To perform a ritual or make offerings to deities or ancestors; a sacrificial or worship ritual."},{"word":"悔意","pinyin":"huǐ yì","pos":"名","zh":"因为做错事或造成不好的结果而产生的后悔之情。","en":"A feeling of regret or remorse about something one has done."},{"word":"逝去","pinyin":"shì qù","pos":"动","zh":"离开人世；也可指时间或事物消失。","en":"To pass away; also, for time or something function markWords(text){
 let words=vocab.map(v=>v.word).sort((a,b)=>b.length-a.length);
 let re=new RegExp('('+words.map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')','g');
 return escapeHTML(text).replace(re,m=>`<button class="vocab" data-word="${escapeHTML(m)}" onclick="showDefinition('${escapeHTML(m)}', this)" aria-label="查看${escapeHTML(m)}释义">${m}</button>`);
}
function renderBook(){
 let html=`<div class="reader-tools"><span class="pill">导读与课文</span><span class="pill">${vocab.length} 个重点词语可点击</span><button onclick="readArticle()">🔊 点读 / 朗读</button><button onclick="stopReading()">停止朗读</button></div><div class="reader-layout"><article class="book-page" id="bookPage"><div class="book-title"><div class="eyebrow">国际学生汉语阅读（高级）· 文化对比学习单元</div><h2>第一单元 纪念与行礼</h2><p>清明扫墓与墨西哥亡灵节｜HSK 5—6 阅读与表达训练</p></div>`;

function showDefinition(word, anchor){
 let v=vocabMap[word];
 if(!v){toast('这个词暂时没有注释，请点击带虚线下划线的词语。');return}
 const old=document.getElementById('definitionPopover');
 if(old)old.remove();
 const pop=document.createElement('div');
 pop.id='definitionPopover';
 pop.className='definition-popover';
 pop.setAttribute('role','dialog');
 pop.setAttribute('aria-label',`${word}的词汇注释`);
 pop.innerHTML=`<button class="close" aria-label="关闭注释" onclick="clearDefinition()">关闭 ×</button><div class="eyebrow">词汇注释</div><div class="word">${escapeHTML(v.word)}</div><div class="muted">${escapeHTML(v.pinyin)} · ${escapeHTML(v.pos)}</div><div style="margin-top:12px"><b>中文释义</b><div>${escapeHTML(v.zh)}</div></div><div class="en"><b>English explanation</b><div>${escapeHTML(v.en)}</div></div><div class="key">词义说明结合本课语境编写；文化专名提供简明背景解释。</div>`;
 document.body.appendChild(pop);
 const rect=(anchor||document.activeElement)?.getBoundingClientRect?.() || {left:20,right:40,top:20,bottom:40};
 const margin=12, gap=8;
 const pw=pop.offsetWidth, ph=pop.offsetHeight;
 let left=Math.max(margin,Math.min(rect.left,window.innerWidth-pw-margin));
 let top=rect.bottom+gap;
 if(top+ph>window.innerHeight-margin && rect.top-ph-gap>=margin)top=rect.top-ph-gap;
 top=Math.max(margin,Math.min(top,window.innerHeight-ph-margin));
 pop.style.left=`${left}px`;
 pop.style.top=`${top}px`;
 // Close on Escape, or when the user clicks outside the word and the popover.
 pop._outsideHandler=function(event){
   if(event.type==='keydown' && event.key==='Escape'){clearDefinition();return}
   if(event.type==='click' && !event.target.closest('#definitionPopover') && !event.target.closest('.vocab'))clearDefinition();
 };
 document.addEventListener('click',pop._outsideHandler);
 document.addEventListener('keydown',pop._outsideHandler);
 pop._cleanup=function(){
   document.removeEventListener('click',pop._outsideHandler);
   document.removeEventListener('keydown',pop._outsideHandler);
 };
}
function clearDefinition(){let pop=document.getElementById('definitionPopover');if(pop){if(pop._cleanup)pop._cleanup();pop.remove()}}

 return html+'</div>';
}
function gradeText(text,q){let t=text.trim();if(!t)return {grade:'D',feedback:'尚未提供作答内容，请先完成回答。'};let chars=t.length;let hasConnectors=/因为|所以|不只是|不仅|不一定|与其|对.*来说|虽然|但是|因此|纪念|亲人|逝者/.test(t);let unclear=/（待补充|xxx|不知道|随便写/.test(t);if(chars<8||unclear)return {grade:'D',feedback:'回答过短或信息不完整。建议补充完整意思，检查句子是否通顺。'};if(chars<18||!hasConnectors)return {grade:'C',feedback:'基本表达了意思，但内容还可以更具体。请检查用词是否准确，并补充与题目相关的理由或例子。'};if(chars<35)return {grade:'B',feedback:'整体意思清楚，句子基本通顺。可以进一步调整词语搭配，并检查是否存在指代不清或歧义。'};return {grade:'A',feedback:'表达较完整，整体通顺，用词基本恰当。请继续留意句间逻辑以及个别词语是否精准。'};}
function renderStudentFeedback(s,q){return `<div class="result"><b>评阅等级：${s.grade}</b><p>${escapeHTML(s.feedback)}</p><div class="rubric">评阅维度：语言通顺 · 用词恰当 · 表意清楚（当前为规则演示，非真实 AI 评阅）</div><hr style="border:0;border-top:1px solid #dce5ef"><b>参考答案 / 参考要点</b><p>${escapeHTML(q.reference)}</p>${s.teacherComment?`<p><b>教师留言：</b>${escapeHTML(s.teacherComment)}</p>`:''}</div>`}
function submitObjective(){let all=getSubmissions();let count=0;objective.forEach(q=>{let picked=document.querySelector(`input[name="${q.id}"]:checked`);if(!picked)return;let answer=Number(picked.value),correct=answer===q.answer;let obj={qid:q.id,title:q.title,student:state.identity,class:students.find(s=>s.name===state.identity)?.cls||classes[0],type:'客观题',answer,answerText:q.options[answer],correct,grade:correct?'A':'C',feedback:correct?'回答正确。':'请结合课文重新理解题意。',timestamp:new Date().toLocaleString()};all=all.filter(s=>!(s.student===state.identity&&s.qid===q.id));all.push(obj);count++});saveSubmissions(all);render();toast(`已提交 ${count} 道客观题，结果与答案已显示。`)}
function submitSubjective(id){let q=subjective.find(x=>x.id===id);let el=document.getElementById('ans-'+id);let answer=el?.value||'';if(!answer.trim()){toast('请先输入答案。');return}let g=gradeText(answer,q);let s={qid:id,title:q.title,prompt:q.prompt,student:state.identity,class:students.find(s=>s.name===state.identity)?.cls||classes[0],type:id.startsWith('sentence')?'语言点造句':'主观题',answer,grade:g.grade,feedback:g.feedback,reference:q.reference,timestamp:new Date().toLocaleString()};let all=getSubmissions().filter(x=>!(x.student===state.identity&&x.qid===id));all.push(s);saveSubmissions(all);render();toast('已完成演示评阅；参考答案已开放。')}
function renderLanguage(){return `<div class="panel"><h3>六个语言点 · 逐题造句</h3><p>每个语言点造一个句子。提交后查看等级、修改建议与参考例句。</p>${subjective.filter(q=>q.id.startsWith('sentence')).map(q=>{let old=getSubmissions().find(s=>s.student===state.identity&&s.qid===q.id);return `<div class="question"><h4>${escapeHTML(q.title)}</h4><p>${escapeHTML(q.prompt)}</p><textarea id="ans-${q.id}" placeholder="请使用指定语言点造句">${old?escapeHTML(old.answer):''}</textarea><div class="actions"><button class="primary" onclick="submitSubjective('${q.id}')">${old?'重新提交':'提交并评阅'}</button></div>${old?renderStudentFeedback(old,q):''}</div>`}).join('')}</div>`}
function renderResources(){return `<div class="grid"><div class="media-card"><div class="media-art">🌼</div><div class="media-body"><b>清明节：扫墓与踏青</b><p class="muted">图文拓展：春季节气、祭扫习俗与家庭记忆。</p><a href="https://www.unesco.org/" target="_blank" rel="noopener">浏览 UNESCO 文化资料 ↗</a></div></div><div class="media-card"><div class="media-art">💀</div><div class="media-body"><b>墨西哥亡灵节</b><p class="muted">图文拓展：万寿菊、祭坛、食物与家庭纪念。</p><a href="https://ich.unesco.org/" target="_blank" rel="noopener">浏览非遗资料 ↗</a></div></div><div class="media-card"><div class="media-art">🎥</div><div class="media-body"><b>视频拓展区</b><p class="muted">正式版可在这里嵌入教师审核过的视频、字幕与词汇注释。</p><button onclick="toast('当前为演示区，尚未配置具体视频文件。')">查看视频说明</button></div></div></div><div class="panel" style="margin-top:16px"><h3>拓展思考</h3><p>不同文化如何纪念逝者？当传统仪式发生变化时，怎样才能保留纪念的意义？</p><button class="primary" onclick="go('practice')">回答拓展题 →</button></div>`}
function renderProgress(){let subs=getSubmissions().filter(s=>s.student===state.identity);let correct=subs.filter(s=>s.type==='客观题'&&s.correct).length;let obj=subs.filter(s=>s.type==='客观题').length;return `<div class="stats"><div class="stat"><div class="value">${subs.length}</div><div class="label">已提交题目</div></div><div class="stat"><div class="value">${obj?Math.round(correct/obj*100)+'%':'—'}</div><div class="label">客观题正确率</div></div><div class="stat"><div class="value">${subs.filter(s=>s.type!=='客观题').length}</div><div class="label">主观题提交</div></div><div class="stat"><div class="value">${subs.filter(s=>s.grade==='A'||s.grade==='B').length}</div><div class="label">A/B 等级</div></div></div><div class="panel"><h3>个人作答记录</h3>${subs.length?`<div class="table-wrap"><table><thead><tr><th>题目</th><th>我的答案</th><th>结果</th><th>提交时间</th></tr></thead><tbody>${subs.map(s=>`<tr><td>${escapeHTML(s.title||s.qid)}</td><td>${escapeHTML(s.answerText||s.answer||'')}</td><td>${s.type==='客观题'?(s.correct?'正确':'错误'):'等级 '+escapeHTML(s.grade||'—')}</td><td>${escapeHTML(s.timestamp||'')}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">还没有提交记录。完成课后练习后，记录会显示在这里。</div>'}</div>`}
function getTeacherStats(){let subs=getSubmissions();let obj=subs.filter(s=>s.type==='客观题');return {subs,obj,correct:obj.filter(s=>s.correct).length,accuracy:obj.length?Math.round(obj.filter(s=>s.correct).length/obj.length*100):0}}
function renderTeacher(main){if(state.page==='dashboard'){main.innerHTML=renderDashboard();return}if(state.page==='students'){main.innerHTML=renderStudents();return}if(state.page==='review'){main.innerHTML=renderReview();return}if(state.page==='analytics'){main.innerHTML=renderAnalytics();return}if(state.page==='course'){main.innerHTML=renderCourse();return}if(state.page==='resources'){main.innerHTML=pageHead('拓展资源管理','教师可以维护补充阅读、视频链接与教学提示。')+renderResources();return}main.innerHTML=renderDashboard()}
function renderDashboard(){let st=getTeacherStats(),subs=st.subs;let pending=subs.filter(s=>s.type!=='客观题'&&!s.teacherReviewed).length;return pageHead('教学概览','查看班级提交、客观题正确率与待复核的主观题。',`<button onclick="go('review')">进入作业评阅 →</button>`)+`<div class="stats"><div class="stat"><div class="value">${students.length}</div><div class="label">演示学生人数</div></div><div class="stat"><div class="value">${subs.length}</div><div class="label">已提交答案</div></div><div class="stat"><div class="value">${st.accuracy}%</div><div class="label">客观题正确率</div></div><div class="stat"><div class="value">${pending}</div><div class="label">待教师复核主观题</div></div></div><div class="grid"><div class="panel"><h3>按班级查看</h3><p class="muted">选择班级后查看该班学生作答与正确率。</p><select id="dashClass" class="field" onchange="state.selectedClass=this.value;render()"><option>全部班级</option>${classes.map(c=>`<option ${state.selectedClass===c?'selected':''}>${c}</option>`).join('')}</select><div class="actions"><button onclick="go('students')">管理学生</button><button onclick="go('analytics')">正确率分析</button></div></div><div class="panel"><h3>学生作答状态</h3>${students.map(s=>{let n=subs.filter(x=>x.student===s.name).length;return `<div style="margin:12px 0"><div style="display:flex;justify-content:space-between"><span>${s.name}</span><span class="muted">${n} 题已提交</span></div><div class="bar"><span style="width:${Math.min(n/12*100,100)}%"></span></div></div>`}).join('')}</div><div class="panel"><h3>教师待办</h3><p>• 复核主观题语言通顺、用词与歧义</p><p>• 对学生作答添加留言</p><p>• 按班级查看题目正确率</p><button class="primary" onclick="go('review')">查看待复核答案</button></div></div><div class="panel"><h3>最近提交</h3>${renderSubmissionTable(subs.slice().reverse().slice(0,6),true)}</div><div class="footer-note">演示数据在当前浏览器中共享给师生两端。正式部署需增加账号鉴权、数据库与服务器端权限控制。</div>`}
function renderStudents(){let q=(document.getElementById('studentSearch')?.value||'').toLowerCase();let cl=state.selectedClass;let list=students.filter(s=>(cl==='全部班级'||s.cls===cl)&&(!q||(s.name+s.id).toLowerCase().includes(q)));let subs=getSubmissions();return pageHead('学生与班级','一个教师可以管理多个班级；按姓名、学号或班级筛选学生。')+`<div class="panel"><div class="filters"><input id="studentSearch" placeholder="搜索学生姓名或学号" oninput="filterStudents()" value="${escapeHTML(q)}"><select onchange="state.selectedClass=this.value;render()"><option>全部班级</option>${classes.map(c=>`<option ${cl===c?'selected':''}>${c}</option>`).join('')}</select><button onclick="showInvite()">生成班级邀请码</button></div><div id="studentsTable">${studentTable(list,subs)}</div><div id="inviteArea"></div></div><div class="two-col"><div class="panel"><h3>添加演示学生</h3><label>学生姓名<input id="newStudentName" class="field" placeholder="输入姓名"></label><label style="display:block;margin-top:10px">分配班级<select id="newStudentClass" class="field">${classes.map(c=>`<option>${c}</option>`).join('')}</select></label><div class="actions"><button class="primary" onclick="addStudent()">添加学生</button></div></div><div class="panel"><h3>学生加入班级</h3><p class="muted">学生可在学生端输入教师邀请码加入对应班级（演示流程）。</p><input id="joinCode" class="field" placeholder="输入邀请码"><button style="margin-top:10px" onclick="joinClass()">加入班级</button><div id="joinMsg"></div></div></div>`}
function studentTable(list,subs){return `<div class="table-wrap"><table><thead><tr><th>学生</th><th>学号</th><th>班级</th><th>提交题数</th><th>客观题正确率</th><th>操作</th></tr></thead><tbody>${list.map(s=>{let ss=subs.filter(x=>x.student===s.name),o=ss.filter(x=>x.type==='客观题'),pct=o.length?Math.round(o.filter(x=>x.correct).length/o.length*100)+'%':'—';return `<tr><td><b>${escapeHTML(s.name)}</b></td><td>${s.id}</td><td>${s.cls}</td><td>${ss.length}</td><td>${pct}</td><td><button onclick="state.selectedStudent='${s.name}';go('review')">查看答案</button></td></tr>`}).join('')}</tbody></table></div>`}
function filterStudents(){let q=document.getElementById('studentSearch').value.toLowerCase(),cl=state.selectedClass;let list=students.filter(s=>(cl==='全部班级'||s.cls===cl)&&(!q||(s.name+s.id).toLowerCase().includes(q)));document.getElementById('studentsTable').innerHTML=studentTable(list,getSubmissions())}
function showInvite(){let code='READ-'+Math.random().toString(36).slice(2,7).toUpperCase();localStorage.setItem('hsk_invite_code',code);document.getElementById('inviteArea').innerHTML=`<div class="result"><b>班级邀请码：${code}</b><p>将邀请码发给学生即可。当前为演示码，正式版需由服务器生成并校验。</p><button onclick="navigator.clipboard?.writeText('${code}');toast('邀请码已复制（若浏览器允许）')">复制邀请码</button></div>`}
function addStudent(){let name=document.getElementById('newStudentName').value.trim();if(!name){toast('请输入学生姓名');return}if(students.some(s=>s.name===name)){toast('该学生已存在');return}students.push({name,id:'S2026'+String(students.length+1).padStart(3,'0'),cls:document.getElementById('newStudentClass').value,last:'—',submitted:0});render();toast('演示学生已添加')}
function joinClass(){let code=document.getElementById('joinCode').value.trim(),real=localStorage.getItem('hsk_invite_code');document.getElementById('joinMsg').innerHTML=code&&code===real?'<div class="result good">邀请码有效。正式版将在此处完成账号与班级绑定。</div>':'<div class="result">邀请码不正确，或尚未生成。</div>'}
function renderReview(){let subs=getSubmissions();let sel=state.selectedStudent;let cl=state.selectedClass;let filtered=subs.filter(s=>(sel==='全部学生'||s.student===sel)&&(cl==='全部班级'||s.class===cl));return pageHead('作业与评阅','教师不需要做题；在这里查看学生原始答案、评阅等级、正确答案与教师留言。')+`<div class="panel"><div class="filters"><select onchange="state.selectedStudent=this.value;render()"><option>全部学生</option>${students.map(s=>`<option ${sel===s.name?'selected':''}>${s.name}</option>`).join('')}</select><select onchange="state.selectedClass=this.value;render()"><option>全部班级</option>${classes.map(c=>`<option ${cl===c?'selected':''}>${c}</option>`).join('')}</select><select onchange="state.selectedTab=this.value;render()"><option value="all" ${state.selectedTab==='all'?'selected':''}>全部作答</option><option value="subjective" ${state.selectedTab==='subjective'?'selected':''}>主观题</option><option value="objective" ${state.selectedTab==='objective'?'selected':''}>客观题</option></select></div>${renderSubmissionTable(filtered.filter(s=>state.selectedTab==='all'||(state.selectedTab==='subjective'?s.type!=='客观题':s.type==='客观题')),false)}</div>`}
function renderSubmissionTable(subs,compact){if(!subs.length)return '<div class="empty">暂无作答记录。可切换到学生端提交答案，教师端会同步显示。</div>';return `<div class="table-wrap"><table><thead><tr><th>学生 / 班级</th><th>题目</th><th>学生答案</th><th>结果</th><th>教师复核 / 留言</th></tr></thead><tbody>${subs.map((s,i)=>`<tr><td><b>${escapeHTML(s.student)}</b><br><span class="muted">${escapeHTML(s.class||'')}</span></td><td>${escapeHTML(s.title||s.qid)}<br><span class="pill">${escapeHTML(s.type||'')}</span></td><td>${escapeHTML(s.answerText||s.answer||'')}</td><td>${s.type==='客观题'?`${s.correct?'<span class="pill green">正确</span>':'<span class="pill red">错误</span>'}<br>正确答案：${escapeHTML(objective.find(q=>q.id===s.qid)?.options[objective.find(q=>q.id===s.qid)?.answer]||'')}`:`<span class="pill ${s.grade==='A'||s.grade==='B'?'green':s.grade==='D'?'red':'orange'}">等级 ${escapeHTML(s.grade||'—')}</span><br>${escapeHTML(s.feedback||'')}`}</td><td>${s.type==='客观题'?'—':`<textarea id="comment-${i}" placeholder="教师留言">${escapeHTML(s.teacherComment||'')}</textarea><div class="actions"><select id="grade-${i}"><option ${s.grade==='A'?'selected':''}>A</option><option ${s.grade==='B'?'selected':''}>B</option><option ${s.grade==='C'?'selected':''}>C</option><option ${s.grade==='D'?'selected':''}>D</option></select><button onclick="saveReview('${escapeHTML(s.student)}','${escapeHTML(s.qid)}','comment-${i}','grade-${i}')">保存复核</button></div>`}</td></tr>`).join('')}</tbody></table></div>`}
function saveReview(student,qid,commentId,gradeId){let all=getSubmissions();let s=all.find(x=>x.student===student&&x.qid===qid);if(!s)return;s.teacherComment=document.getElementById(commentId).value;s.grade=document.getElementById(gradeId).value;s.teacherReviewed=true;saveSubmissions(all);toast('教师复核已保存');render()}
function renderAnalytics(){let subs=getSubmissions(),objs=subs.filter(s=>s.type==='客观题');let qstats=objective.map(q=>{let a=objs.filter(s=>s.qid===q.id);return {q,n:a.length,c:a.filter(s=>s.correct).length,p:a.length?Math.round(a.filter(s=>s.correct).length/a.length*100):0}});return pageHead('正确率分析','查看每道客观题的正确率，以及不同学生的学习表现。')+`<div class="stats"><div class="stat"><div class="value">${objs.length}</div><div class="label">客观题作答总数</div></div><div class="stat"><div class="value">${objs.length?Math.round(objs.filter(s=>s.correct).length/objs.length*100):0}%</div><div class="label">整体正确率</div></div><div class="stat"><div class="value">${new Set(objs.map(s=>s.student)).size}</div><div class="label">参与客观题学生数</div></div><div class="stat"><div class="value">${subs.filter(s=>s.type!=='客观题').length}</div><div class="label">主观题作答数</div></div></div><div class="panel"><h3>题目正确率</h3>${qstats.map(x=>`<div style="margin:16px 0"><div style="display:flex;justify-content:space-between;gap:12px"><span>${escapeHTML(x.q.title)}</span><b>${x.n?x.p+'%':'暂无数据'}</b></div><div class="bar" style="margin-top:6px"><span style="width:${x.p}%"></span></div><div class="muted" style="font-size:12px;margin-top:4px">作答 ${x.n} 人次 · 答对 ${x.c} 人次</div></div>`).join('')}</div><div class="panel"><h3>学生正确率</h3><div class="table-wrap"><table><thead><tr><th>学生</th><th>班级</th><th>答题数</th><th>答对数</th><th>正确率</th></tr></thead><tbody>${students.map(s=>{let a=objs.filter(x=>x.student===s.name),c=a.filter(x=>x.correct).length;return `<tr><td>${s.name}</td><td>${s.cls}</td><td>${a.length}</td><td>${c}</td><td>${a.length?Math.round(c/a.length*100)+'%':'—'}</td></tr>`}).join('')}</tbody></table></div></div>`}
function renderCourse(){return pageHead('课程与答案管理','教师查看完整参考答案与评分标准；学生端答案仍遵循“提交并评阅后显示”。')+`<div class="panel"><h3>本单元结构</h3><ul><li>导读与完整课文：已接入样本单元</li><li>课文重点词汇：${vocab.length} 个，含拼音、词性、中文释义、英文解释</li><li>语言点：6 个，每个配有一个造句任务</li><li>客观题：${objective.length} 道</li><li>主观题与语言点任务：${subjective.length} 道</li></ul></div><div class="panel"><h3>教师参考答案</h3><p class="muted">仅教师端显示完整参考答案；学生端必须先提交并评阅。</p>${subjective.map(q=>`<div class="question"><b>${escapeHTML(q.title)}</b><p>${escapeHTML(q.prompt)}</p><div class="result">${escapeHTML(q.reference)}</div></div>`).join('')}</div><div class="panel"><h3>单元入口与二维码规划</h3><div class="two-col"><div style="display:flex;gap:15px;align-items:center"><div class="qr">总目录二维码<br>待正式部署生成</div><div><b>课本总入口</b><p class="muted">进入教材目录与全部单元。</p></div></div><div style="display:flex;gap:15px;align-items:center"><div class="qr">第一单元二维码<br>待正式部署生成</div><div><b>第一单元直达</b><p class="muted">扫码直接打开本课内容。正式网址确定后再生成有效二维码。</p></div></div></div></div>`}
render();
</script>
</body></html>
